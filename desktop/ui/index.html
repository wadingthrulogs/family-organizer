<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Family Organizer</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #10151f;
        color: #e6ecf5;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        /* Wall display: no accidental text selection or rubber-banding on touch. */
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.75rem;
        padding: 2rem;
        text-align: center;
      }
      .mark {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        font-size: 2.5rem;
        background: linear-gradient(145deg, #2b6cb0, #1a4a7a);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        animation: breathe 2.8s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1);    opacity: 0.92; }
        50%      { transform: scale(1.05); opacity: 1;    }
      }
      h1 { margin: 0; font-size: 1.6rem; font-weight: 600; letter-spacing: 0.01em; }
      #status {
        margin: 0;
        min-height: 1.5em;
        font-size: 1.05rem;
        color: #9fb2c9;
      }
      .host {
        position: fixed;
        bottom: 1.25rem;
        font-size: 0.8rem;
        color: #55657a;
        font-variant-numeric: tabular-nums;
      }
      /* Respect users who ask for less motion, even on a kiosk. */
      @media (prefers-reduced-motion: reduce) {
        .mark { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" role="img" aria-label="Family Organizer">🏠</div>
      <h1>Family Organizer</h1>
      <p id="status" role="status" aria-live="polite">Starting up…</p>
    </main>
    <div class="host" id="host"></div>

    <script>
      // Called from Rust via window.eval as the shell polls the server.
      window.setStatus = function (message) {
        var el = document.getElementById('status');
        if (el) el.textContent = message;
      };

      // Shown in the corner so it's obvious which server this display targets.
      window.setHost = function (host) {
        var el = document.getElementById('host');
        if (el) el.textContent = host;
      };
    </script>
  </body>
</html>
