services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Optional integrations (Google, SMTP, VAPID, OpenWeather, WEBHOOK_URL, …)
    # can live in backend/.env. Entries under `environment:` below win over it.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/app.db
      - SQLITE_PATH=/data/app.db
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:80}
      - TZ=${TZ:-UTC}
      - SESSION_SECURE=${SESSION_SECURE:-false}
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Recipe-photo extraction bridge to the host Claude Code watcher (subscription-billed).
      # The app only does file I/O here; it never runs claude or holds an API key.
      - RECIPE_EXTRACT_UPLOAD_DIR=/host-recipe-uploads
      - RECIPE_EXTRACT_OUTPUT_DIR=/host-recipe-output
      - RECIPE_EXTRACT_TIMEOUT_MS=${RECIPE_EXTRACT_TIMEOUT_MS:-75000}
    volumes:
      - sqlite_data:/data
      - uploads_data:/app/uploads
      # Host dirs watched by the recipe-image-watcher systemd service.
      # Create these before `up` (setup.sh does) or Docker makes them root-owned.
      - ${RECIPE_UPLOADS_HOST_DIR:-${HOME}/uploads}:/host-recipe-uploads
      - ${RECIPE_OUTPUT_HOST_DIR:-${HOME}/recipe-output}:/host-recipe-output
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # HTTPS is enabled when this is set, or when /etc/tailscale/certs holds
      # exactly one <host>.crt/<host>.key pair. Otherwise nginx serves HTTP.
      - TLS_HOSTNAME=${TLS_HOSTNAME:-}
    volumes:
      - /etc/tailscale/certs:/etc/ssl/tailscale:ro
    # HTTP_PORT / HTTPS_PORT accept a port ("80") or "ip:port" ("127.0.0.1:8080")
    # — use the latter if something else on the host already listens on :80.
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite_data:
  uploads_data:
