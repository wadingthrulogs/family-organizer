# Shared app server body — included by both http.conf.template and
# https.conf.template. Lives in /etc/nginx/snippets/ inside the image.

root /usr/share/nginx/html;
index index.html;

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Gzip compression
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
gzip_min_length 256;

# Root-level backend health check (used by setup.sh and monitoring)
location = /healthz {
    proxy_pass http://backend:3000/healthz;
}

# Proxy API requests to the backend service
location /api/ {
    proxy_pass         http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Allow image uploads (recipe photo / attachments, up to 10 MB).
    client_max_body_size 12m;
    # Recipe-photo extraction holds the request open while the host AI runs.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location /ws {
    proxy_pass         http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
}

# index.html must always revalidate. It is the only unhashed file, and it is
# what points at the content-hashed bundles. Without a Cache-Control header it
# gets heuristically cached and clients (e.g. the wall display) keep loading an
# old build. `expires -1` rather than add_header, because an add_header in a
# location block suppresses the inherited server-level security headers.
location = /index.html {
    expires -1;
    try_files $uri =404;
}

# SPA fallback
location / {
    try_files $uri $uri/ /index.html;
}

# Cache static assets
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}
