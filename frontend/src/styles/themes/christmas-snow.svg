<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <g id="arm" stroke="#F8F5EC" stroke-width="1.6" stroke-linecap="round" fill="none">
      <line x1="0" y1="0" x2="0" y2="-18"/>
      <line x1="0" y1="-11" x2="-5" y2="-15"/>
      <line x1="0" y1="-11" x2="5" y2="-15"/>
      <line x1="0" y1="-5" x2="-3.5" y2="-8"/>
      <line x1="0" y1="-5" x2="3.5" y2="-8"/>
    </g>
    <g id="flake">
      <use href="#arm"/><use href="#arm" transform="rotate(60)"/><use href="#arm" transform="rotate(120)"/>
      <use href="#arm" transform="rotate(180)"/><use href="#arm" transform="rotate(240)"/><use href="#arm" transform="rotate(300)"/>
    </g>
    <circle id="dot" r="1.6" fill="#F8F5EC"/>
  </defs>
  <g opacity="0.35">
    <use href="#flake" transform="translate(80 70)"/>
    <use href="#flake" transform="translate(330 120) scale(0.6) rotate(20)"/>
    <use href="#flake" transform="translate(420 300) scale(0.85) rotate(-10)"/>
    <use href="#flake" transform="translate(180 280) scale(0.5)"/>
    <use href="#flake" transform="translate(60 400) scale(0.75) rotate(30)"/>
    <use href="#flake" transform="translate(300 430) scale(0.55) rotate(-25)"/>
  </g>
  <g opacity="0.4">
    <use href="#dot" x="200" y="40"/><use href="#dot" x="460" y="60"/><use href="#dot" x="20" y="220"/>
    <use href="#dot" x="250" y="180"/><use href="#dot" x="380" y="220"/><use href="#dot" x="140" y="470"/>
    <use href="#dot" x="470" y="440"/><use href="#dot" x="30" y="30"/><use href="#dot" x="330" y="330"/>
  </g>
</svg>
